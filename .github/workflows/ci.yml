name: Verify library
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.16.0', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Require a reviewed development lockfile
        run: node -e "if (!require('node:fs').existsSync('package-lock.json')) throw Error('Generate and commit package-lock.json with npm install before enabling release CI.');"
      - run: npm ci
      - run: npm run docs
      - run: npm run verify
      - name: Check generated source and entry points
        shell: bash
        run: |
          git diff --exit-code
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            git ls-files --others --exclude-standard
            exit 1
          fi
      - name: Share the verified release tarball
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        uses: actions/upload-artifact@v4
        with:
          name: go-types-tarball
          path: artifacts/*.tgz
          if-no-files-found: error
  runtime-consumers:
    needs: source-and-package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['8.0.0', '13.0.0', '8.17.0', '12.17.0', '14.0.0']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Keep the consumer runtime executable
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_ENV, 'GO_TYPES_RUNTIME_NODE=' + process.execPath + '\n')"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: go-types-tarball
          path: artifacts
      - run: npm run test:package
  browsers:
    needs: source-and-package
    # Match the Linux distribution supported by the pinned Playwright binaries.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - uses: actions/download-artifact@v4
        with:
          name: go-types-tarball
          path: artifacts
      - run: npm run test:package -- --browser
  typescript:
    needs: source-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        typescript: ['4.5.2', '4.9.5', '5.0.2', '5.8.3']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: go-types-tarball
          path: artifacts
      - name: Install the verified candidate and selected compiler
        shell: bash
        run: |
          mapfile -t archives < <(find artifacts -maxdepth 1 -name '*.tgz' -type f)
          test "${#archives[@]}" -eq 1
          npm install --prefix "$RUNNER_TEMP/consumer" --ignore-scripts --no-audit --no-fund "$PWD/${archives[0]}"
          npm install --prefix "$RUNNER_TEMP/compiler" --ignore-scripts --no-audit --no-fund "typescript@${{ matrix.typescript }}"
      - name: Check the installed package with shared contracts
        run: node scripts/test-types-compat.js --compiler "${{ runner.temp }}/compiler/node_modules/typescript/lib/tsc.js" --package "${{ runner.temp }}/consumer/node_modules/go-types"
